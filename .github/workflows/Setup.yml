name: Setup Forked Repo

on:
  fork:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup and Configure
        env:
          FORK_USER: ${{ github.repository_owner }}
          FORK_REPO: ${{ github.event.repository.name }}
          FORK_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Handle Assets Cleanup
          if [ -d "assets" ]; then
            rm -rf assets/*
            touch assets/.gitkeep
          fi
          
          # 2. Update Store.py
          sed -i "8s|GITHUB_USER = \".*\"|GITHUB_USER = \"$FORK_USER\"|" Store.py
          sed -i "9s|REPO_NAME = \".*\"|REPO_NAME = \"$FORK_REPO\"|" Store.py
          sed -i "10s|BRANCH = \".*\"|BRANCH = \"$FORK_BRANCH\"|" Store.py
          
          # 3. Check for changes and push
          # 'git diff --exit-code' returns 1 if there are changes
          if ! git diff --quiet; then
            git add .
            git commit -m "Automated setup: clear assets and update config for fork"
            git push
          else
            echo "No changes detected, skipping commit."
          fi
