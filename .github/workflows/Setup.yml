name: Setup Forked Repo

on:
  fork:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup and Configure
        env:
          FORK_USER: ${{ github.repository_owner }}
          FORK_REPO: ${{ github.event.repository.name }}
          FORK_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          sed -i "8s|GITHUB_USER = \".*\"|GITHUB_USER = \"$FORK_USER\"|" Store.py
          sed -i "9s|REPO_NAME = \".*\"|REPO_NAME = \"$FORK_REPO\"|" Store.py
          sed -i "10s|BRANCH = \".*\"|BRANCH = \"$FORK_BRANCH\"|" Store.py
          
          if [ -d "assets" ]; then
            # Check if assets folder is not already empty/just .gitkeep
            if [ "$(ls -A assets/ | grep -v '^\.gitkeep$')" ]; then
              rm -rf assets/*
              touch assets/.gitkeep
            fi
          fi
          
          if ! git diff --quiet; then
            git add .
            git commit -m "Automated setup: refresh config and clean assets"
            git push
          else
            echo "No changes detected, skipping commit."
          fi
