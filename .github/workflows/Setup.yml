name: Setup Forked Repo

on:
  fork:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup and Configure
        env:
          FORK_USER: ${{ github.repository_owner }}
          FORK_REPO: ${{ github.event.repository.name }}
          FORK_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Explicitly set the remote URL to the current repository (the fork)
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin
          git checkout ${{ github.event.repository.default_branch }}

          sed -i '8,10d' Store.py
          sed -i "7aGITHUB_USER = \"$FORK_USER\"\nREPO_NAME = \"$FORK_REPO\"\nBRANCH = \"$FORK_BRANCH\"" Store.py
          
          if [ -d "assets" ]; then
            if [ "$(ls -A assets/ | grep -v '^\.gitkeep$')" ]; then
              rm -rf assets/*
              touch assets/.gitkeep
            fi
          fi
          
          git add .
          git commit -m "Automated setup: refresh config and clean assets" || echo "No changes to commit"
          git push origin ${{ github.event.repository.default_branch }}
