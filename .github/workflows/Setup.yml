name: Setup Forked Repo

on:
  fork:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup and Configure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_USER: ${{ github.repository_owner }}
          FORK_REPO: ${{ github.event.repository.name }}
          FORK_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -d "assets" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            rm -rf assets/*
            touch assets/.gitkeep
            git add assets/
            git commit -m "Cleanup: clear assets/ on fork"
            git push
          fi
          sed -i "8s|GITHUB_USER = \".*\"|GITHUB_USER = \"$FORK_USER\"|" Store.py
          sed -i "9s|REPO_NAME = \".*\"|REPO_NAME = \"$FORK_REPO\"|" Store.py
          sed -i "10s|BRANCH = \".*\"|BRANCH = \"$FORK_BRANCH\"|" Store.py

          git add Store.py
          git commit -m "Config: update Store.py for fork"
          git push
